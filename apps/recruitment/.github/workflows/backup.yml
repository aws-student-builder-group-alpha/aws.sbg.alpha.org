name: Encrypted database backup

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-database-backup
  cancel-in-progress: false

jobs:
  backup:
    # Activation requires owner setup; never expose real data through a public repository.
    if: ${{ vars.BACKUPS_ENABLED == 'true' && github.event.repository.private == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install verified encryption tool
        run: node scripts/install-backup-tools.mjs
      - name: Create encrypted snapshot
        env:
          BACKUP_PROJECT_REF: ${{ vars.BACKUP_PROJECT_REF }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_PGHOST: ${{ secrets.BACKUP_PGHOST }}
          BACKUP_PGPORT: ${{ secrets.BACKUP_PGPORT }}
          BACKUP_PGUSER: ${{ secrets.BACKUP_PGUSER }}
          BACKUP_PGPASSWORD: ${{ secrets.BACKUP_PGPASSWORD }}
        run: |
          export PATH="$PWD/.next/backup-tools/age:$PATH"
          node scripts/backup.mjs
      - name: Retain encrypted snapshot for 35 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-backup-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 35
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          path: |
            .backups/**/database.dump.age
            .backups/**/manifest.json
      - name: Remove runner copy
        if: ${{ always() }}
        run: |
          node --input-type=module -e "import {rm} from 'node:fs/promises'; import path from 'node:path'; await rm(path.join(process.cwd(),'.backups'),{recursive:true,force:true});"
